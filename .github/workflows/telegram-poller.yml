name: Telegram Poller
on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository via git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Cloning repository into workspace..."
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" .
          git rev-parse --is-inside-work-tree || true

      - name: Ensure Python is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip git

      - name: Install dependencies
        run: python3 -m pip install -r requirements-poller.txt

      - name: Run Telegram poller
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          AUTH_USERS: ${{ secrets.AUTH_USERS }}
          # confirmation options
          REQUIRE_CONFIRMATION: true
          CONFIRM_TIMEOUT: 600
          # GitHub env for run URL
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 poll_telegram.py

      - name: Commit offset and pending state if changed
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain telegram_offset.json pending_confirmations.json run_output.json run_logs)" ]; then
            git config user.email "actions@github.com"
            git config user.name "github-actions[bot]"
            git add telegram_offset.json pending_confirmations.json run_output.json run_logs || true
            git commit -m "Update telegram poller state" || true
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" || true
          else
            echo "No state changes to commit."
          fi
